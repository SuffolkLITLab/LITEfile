<!doctype html><meta charset="utf-8"><title>LITEfile issue 416 prototype</title><style>body{font:16px system-ui;max-width:780px;margin:35px auto;background:#f5f7fa;color:#18324a}article{background:white;border:1px solid #ccd5df;padding:18px;margin:12px 0;border-radius:10px}button,select{padding:9px;margin:6px;font:inherit}button{cursor:pointer}.warn{background:#fff0cf;padding:15px}</style><h1>LITEfile: per-document filing codes</h1><p>Interactive design study for issue #416. Fictional data; no actual filing.</p><button onclick="mode=0;render()">A: One-page checklist</button><button onclick="mode=1;render()">B: Guided matching</button><button onclick="location.reload()">Reset</button><div id="app"></div><script>let files=['Complaint.pdf','Cover sheet.pdf','Summons.pdf','Exhibit part 1.pdf','Exhibit part 2.pdf'],codes=['Complaint','Cover sheet','Summons','Exhibit','Other'],v=files.map(()=>codes[0]),done=files.map(()=>false),mode=0,step=0,open=0,ack=false;function sel(i){return '<select onchange="v['+i+']=this.value;done['+i+']=false;ack=false;render()">'+codes.map(c=>'<option '+(v[i]===c?'selected':'')+'>'+c+'</option>').join('')+'</select>'}function repeat(){return v.some((x,i)=>v.indexOf(x)!==i)}function warn(){return repeat()?'<div class="warn">Repeated filing codes detected. This can be legitimate for split exhibits.<br><label><input type="checkbox" '+(ack?'checked':'')+' onchange="ack=this.checked;render()"> I reviewed these repeated codes.</label></div>':''}function finish(){document.getElementById('app').innerHTML='<article>Review complete. A real system would now display the complete filing summary.</article>'}function render(){let s='';if(!mode){s='<h2>Review each document</h2><p>Every uploaded document needs its own filing code.</p>'+files.map((f,i)=>'<article><b>'+(i+1)+'. '+f+'</b> — '+(done[i]?'Reviewed':'Needs review')+'<br><button onclick="open='+i+';render()">Review</button>'+(open===i?sel(i)+'<button onclick="done['+i+']=true;open='+((i+1)%5)+';render()">Confirm</button>':'')+'</article>').join('')+warn()+'<button '+(done.every(Boolean)&&(!repeat()||ack)?'':'disabled')+' onclick="finish()">Continue</button>'}else if(step<5){s='<article><h2>Document '+(step+1)+' of 5</h2><b>'+files[step]+'</b><p>Choose its filing code:</p>'+sel(step)+'<br><button '+(step?'':'disabled')+' onclick="step--;render()">Back</button><button onclick="done[step]=true;step++;render()">Save and next</button></article>'}else{s='<h2>Final matching review</h2>'+files.map((f,i)=>'<article><b>'+f+'</b><br>'+sel(i)+'</article>').join('')+warn()+'<button '+(repeat()&&!ack?'disabled':'')+' onclick="finish()">Confirm all matches</button>'}document.getElementById('app').innerHTML=s}render();</script>
