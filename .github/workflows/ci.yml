name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, type, tests, bandit, dependencies]
    name: "${{ matrix.check }}"
    steps:
      # Common setup
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        # 10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: '3.12'
          version: "latest-known"

      - name: Ensure Python 3.12 and sync deps (dev)
        working-directory: efile_app
        run: |
          uv python install 3.12
          uv sync --locked --group dev

      # No per-check installs needed; everything is managed by uv

      # ruff
      - name: Formatting (check only)
        if: matrix.check == 'ruff'
        working-directory: efile_app
        run: |
          uv run ruff format --check .
          uv run djlint --check .
          git ls-files '*.css' | xargs -n 1 --verbose bash -c 'diff -ru "$0" <(uv run css-beautify "$0")'
          git -C .. ls-files 'efile_app/**/*.js' | while IFS= read -r file; do
            relative="${file#efile_app/}"
            diff -ru "$relative" <(uv run js-beautify "$relative")
          done

      - name: Ruff lint
        if: matrix.check == 'ruff'
        working-directory: efile_app
        run: |
          uv run ruff check .
          uv run djlint .

      # type checking
      - name: Type check (ty)
        if: matrix.check == 'type'
        working-directory: efile_app
        run: uv run ty check

      # tests
      - name: Run tests
        if: matrix.check == 'tests'
        env:
          SUFFOLK_EFILE_API_KEY: ${{ secrets.EFILE_PROXY_API_KEY }}
          TESTS_TYLER_USERNAME: ${{ secrets.TYLER_EMAIL }}
          TESTS_TYLER_PASSWORD: ${{ secrets.TYLER_PASSWORD }}
          DJANGO_SETTINGS_MODULE: efile.settings
        working-directory: efile_app
        run: |
          # Keep the migration graph deployable. pytest uses --nomigrations, so
          # the test suite alone would not catch conflicting migration leaves.
          uv run python manage.py makemigrations --check --dry-run
          uv run pytest -q

      - name: Bandit security scan
        if: matrix.check == 'bandit'
        working-directory: efile_app
        run: uv run bandit -r efile --exclude efile/tests

      - name: Audit resolved dependencies
        if: matrix.check == 'dependencies'
        working-directory: efile_app
        run: uv run pip-audit --local --skip-editable

  javascript:
    name: javascript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: efile_app/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: efile_app
        run: npm ci

      - name: ESLint (including SonarJS)
        working-directory: efile_app
        run: npm run lint:js

      - name: Prettier
        working-directory: efile_app
        run: npm run format:js:check

      - name: Stylelint accessibility rules
        working-directory: efile_app
        run: npm run lint:css

      - name: JavaScript unit tests
        working-directory: efile_app
        run: npm run test:unit
