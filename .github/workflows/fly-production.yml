name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.litefile.org
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip commits superseded on main
        id: current
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$(git rev-parse HEAD)" = "$latest" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is on main; its CI run will deploy it."
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: steps.current.outputs.deploy == 'true'
      - name: Deploy the tested commit
        if: steps.current.outputs.deploy == 'true'
        run: flyctl deploy --remote-only --config fly.production.toml --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PRODUCTION_API_TOKEN }}
      - name: Check the public site
        if: steps.current.outputs.deploy == 'true'
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 https://app.litefile.org/about/ > /dev/null
