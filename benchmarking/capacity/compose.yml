name: litefile-capacity-270
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: capacity
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: local-capacity-only
    command: [postgres, -c, max_connections=60, -c, shared_buffers=256MB, -c, log_min_duration_statement=500]
    cpus: 2
    mem_limit: 1g
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U capacity]
      interval: 2s
      retries: 30
  storage:
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    image: localstack/localstack:4.10.0
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    cpus: 1
    mem_limit: 768m
    networks: [isolated]
  web:
    image: litefile-capacity:270
    environment:
      DJANGO_SETTINGS_MODULE: capacity.settings
      DJANGO_SECRET_KEY: isolated-capacity-test-key-never-use-outside-this-stack
      DATABASE_URL: postgres://capacity:local-capacity-only@dbnet:5432/capacity
      PYTHONPATH: /bench
      AWS_EC2_METADATA_DISABLED: 'true'
    volumes:
      - ..:/bench
    command: [/app/efile_app/.venv/bin/gunicorn, efile.asgi:application, -k, uvicorn.workers.UvicornWorker, --bind, '0.0.0.0:8000', --workers, '2', --timeout, '60', --access-logfile, '-', --error-logfile, '-']
    cpus: 1
    mem_limit: 1g
    networks: [isolated]
    depends_on:
      db:
        condition: service_healthy
  dbnet:
    image: litefile-capacity:270
    volumes: ['..:/bench']
    command: [/app/efile_app/.venv/bin/python, /bench/capacity/db_proxy.py]
    cpus: 1
    mem_limit: 128m
    networks: [isolated]
    depends_on: [db]
  gateway:
    image: nginx:alpine
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['127.0.0.1:8270:8000']
    networks: [isolated, ingress]
    cpus: 0.5
    mem_limit: 128m
    depends_on: [web]
  upstream:
    image: litefile-capacity:270
    volumes: ['..:/bench']
    command: [/app/efile_app/.venv/bin/python, /bench/capacity/upstream.py]
    cpus: 0.5
    mem_limit: 256m
    networks: [isolated]
networks:
  ingress:
  isolated:
    internal: true
