# Same 1 CPU / 1 GB and two workers as baseline: only pooling varies.
services:
  web:
    image: litefile-capacity:pool-micro
    volumes:
      - ../../efile_app/efile:/app/efile_app/efile:ro
    environment:
      DB_POOL_MAX_SIZE: '${MICRO_POOL_SIZE:-0}'
      DB_POOL_TIMEOUT: '30'
  storage:
    mem_limit: 2g
