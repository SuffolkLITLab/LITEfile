worker_rlimit_nofile 16384;
events { worker_connections 4096; }
http {
  access_log off;
  client_max_body_size 40m;
  server {
    listen 8000;
    location / {
      proxy_pass http://web:8000;
      proxy_set_header Host localhost;
      proxy_set_header X-Forwarded-Proto http;
      proxy_read_timeout 65s;
    }
  }
}
