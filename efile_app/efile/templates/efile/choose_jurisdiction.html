{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
    {% translate "Choose your state" as the_title %}
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}" />
        <title>{{ the_title }}</title>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
              rel="stylesheet" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
              rel="stylesheet" />
        <link rel="stylesheet" href="{% static 'css/common.css' %}" />
        <link rel="stylesheet" href="{% static 'css/options.css' %}" />
        <link rel="stylesheet" href="{% static 'css/header.css' %}" />
    </head>
    <body class="d-flex flex-column min-vh-100">
        <div class="header">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <a class="brand-link" href="{% url 'home' %}">
                            <img class="brand-logo"
                                 src="{% static 'img/litefile-logo.svg' %}"
                                 alt="LITEfile logo" />
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <main class="container flex-grow-1 mb-5">
            <h1>{{ the_title }}</h1>
            <div style="display:flex;
                        justify-content:space-evenly;
                        align-content:space-between;
                        flex-wrap:wrap;
                        align-items:center">
                {% for value in jurisdiction_details %}
                    <div class="option-card" style="position:relative">
                        <a href="{% url 'jurisdiction_homepage' jurisdiction=value.jurisdiction.code %}"
                           aria-label="{% blocktranslate with name=value.jurisdiction.display_name %}Choose {{ name }}{% endblocktranslate %}"
                           style="position:absolute;
                                  width:100%;
                                  height:100%;
                                  top: 0px;
                                  left: 0px"></a>
                        <div class="d-flex align-items-center mb-3">
                            <div class="option-icon">
                                <img src="{% static value.jurisdiction.svg %}"
                                     style="max-height:150%"
                                     alt="{{ value.jurisdiction.display_name }}">
                            </div>
                            <div class="option-content">
                                <h3>{{ value.jurisdiction.display_name }}</h3>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </main>
        {% include "efile/components/footer.html" %}
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
        <script src="{% url 'javascript-catalog' %}"></script>
    </body>
</html>
