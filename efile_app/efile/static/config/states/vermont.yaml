filing_timing:
  timezone: America/New_York


jurisdiction:
  name: "Vermont eFile"
  code: "vermont"
  display_name: "Vermont"
  brand_name: "LITEfile"
  logo: "img/litefile-logo.svg"
  logo_alt: "LITEfile logo"
  icon: "fas fa-balance-scale"
  svg: "img/VT.svg"
  api_endpoint: "/api/vermont"
  official_court_name: "the Vermont Judiciary"
  official_tool_statement: "LITEfile is an official, approved electronic filing tool of the Vermont Judiciary."
  court_logos:
    - name: "Vermont Judiciary"
      src: "img/court-logo-vermont.svg"
      alt: "Seal of the State of Vermont"
  partner_logos:
    - name: "Legal Services Vermont (LSV)"
      src: "img/logo-lsv.png"
      alt: "Legal Services Vermont logo"
      url: "https://legalservicesvt.org/"
      role: "Project & Funding Partner"
  help_url: "https://www.vtcourts.gov/self-help"
  help_number: ""
  contact_email: "litlab@suffolk.edu"
  contact_address: "Suffolk University Law School LIT Lab, 120 Tremont Street, Boston, MA"
  # Shown at the top of the start page. Wording from the Vermont Judiciary's
  # e-filing manager, via Kris's October 2026 testing notes.
  copyedit:
    landing_text: |
      **Important:** Vermont rules say that when you e-file in a case, you must
      keep e-filing in that case for as long as it lasts.

      Court staff do not work nights, weekends or state holidays. Your filing
      will not be reviewed, accepted or rejected during those times. If you are
      asking for a Relief from Abuse order, call the
      [after-hours Relief from Abuse phone number](https://www.vtcourts.gov/family/relief-abuse)
      and tell them that you e-filed.

# State metadata, for the address
state:
  code: "VT"
  name: "Vermont"
  jurisdiction: "vermont"

# Words and sentences this jurisdiction says differently. Keys, defaults, and
# what each one is for are in efile/utils/ui_text.py; anything not listed here
# uses the default English wording.
# Vermont requires form-fillable PDFs to be flattened before filing.
# https://www.vtcourts.gov/about-vermont-judiciary/electronic-access/electronic-filing/faqs
document_preparation:
  flatten_pdf_forms: true

text:
  upload_documents:
    preparation_help: >-
      Upload your files as they are. We make PDF copies for court.
    # The PDF rules link lives here, not in preparation_help: a link inside the
    # drop zone opens the file picker instead.
    court_rules_intro: >-
      Before you upload, read these rules that apply to all Vermont courts. The
      court you file into may have more rules. We will show you those before you
      send your documents.
      [Vermont's e-filing questions and answers](https://www.vtcourts.gov/about-vermont-judiciary/electronic-access/electronic-filing/faqs)
      explain its rules for PDF files.
    document_rules_help: >-
      Each court form, pleading, motion and exhibit needs to be its own PDF.
      Sign your documents where needed. The court will reject a document that
      is missing a signature.
    order_help: >-
      Add your most important document first, like a complaint, answer or
      motion. Then add the rest.
  terms:
    # Vermont courts call the document that opens a case a complaint.
    starting_document_example: "complaint"
  organize_documents:
    document_name_help: >-
      Describe it in a few words, like “Small Claims Answer” or “Exhibit A –
      Copy of Contract.” Give each exhibit its own description.
    filing_type_help: >-
      Choose the code that best matches your document. If your kind of motion
      is listed, choose it instead of “Motion.”
  extraction_review:
    marker_meaning: "A * means {brand_name} suggested this answer after reading your document."
    marker_caution: "The suggestion may be wrong. Check it and fix any mistakes."
    helper_prompt_prefilled: "Check the answers we suggested below, or get help choosing."
    court_label: "Court unit or county"
    court_help: "Choose the Vermont court unit or county that should receive this filing."
    case_category_label: "Court division"
    case_category_help: >-
      Choose the court division. For example, Civil includes Small Claims,
      and Family includes Relief from Abuse.
  payment:
    exemption_heading: "No court fees for this type of case"
    # fee_waiver.document_guidance already warns that the court will reject
    # a filing without payment or a waiver, so this would repeat it.
    waiver_documents_warning: ""
  about:
    project_partner_description: >-
      LITEfile's Vermont e-filing integration was developed in close partnership
      with Legal Services Vermont (LSV), who collaborated on funding, building,
      and deploying LITEfile to expand accessible electronic court filing for
      self-represented litigants in Vermont.

# Inherit from base case types and customize
inherits_from: "base-case-types.yaml"

case_types:
  name_change:
    extends: "base_case_types.name_change"
    # Form structure only so far. Document checklists are state-specific -- what
    # Vermont requires, and what its courts call each form, is not what Illinois
    # requires -- so add `matches` and `documents` here to turn one on. See the
    # "Document checklists" section of ../README.md.

# How a filer says which court this filing goes to.
#
# Vermont's public hierarchy is already close to its e-filing hierarchy: court
# level, then Superior Court division, then the geographic unit for the
# divisions that have one. Units follow county lines, so each one is labelled
# with its county -- the Judiciary says "unit", and filers say "county".
court_selector:
  title: "Choose the Vermont court for this filing"
  lede: >-
    Start with the court shown on your paperwork.
  # "Superior Courts" lists each county unit's case types under its own code, so
  # a filer would see each one 14 times with no county named. Every filing it
  # lists is offered by a unit, and no question here leads to it.
  heading_courts:
    - vermont:sc
  steps:
    - id: level
      type: choice
      short_label: "Court"
      label: "What Vermont court is this filing for?"
      options:
        - value: superior
          label: "Superior Court"
          help: "Vermont's trial court."
          courts:
            name_pattern: "Unit$|^Environmental Division$"
        - value: supreme
          label: "Supreme Court"
          help: "Vermont's appellate court, statewide."
          courts:
            name_pattern: "^Supreme Court$"
        - value: bureau
          label: "Judicial Bureau"
          help: "Traffic tickets and other civil violations, statewide."
          courts:
            name_pattern: "^Judicial Bureau$"

    - id: division
      type: select
      short_label: "Division"
      when:
        level: [superior]
      label: "Which Superior Court division?"
      placeholder: "Choose a division…"
      hint: "The division is named on your paperwork."
      # Only the Environmental Division is its own e-filing location. The other
      # four are divisions of the unit the case is filed in, so they narrow
      # nothing here and the unit question below does the routing.
      options:
        - value: civil
          label: "Civil Division"
        - value: criminal
          label: "Criminal Division"
        - value: family
          label: "Family Division"
        - value: probate
          label: "Probate Division"
        - value: environmental
          label: "Environmental Division"
          courts:
            name_pattern: "^Environmental Division$"

    - id: unit
      type: select
      short_label: "Unit"
      when:
        level: [superior]
        division:
          not: [environmental]
      label: "Which court unit?"
      placeholder: "Choose a unit…"
      hint: >-
        Court units follow county lines, so each one is shown with the county
        it covers.
      options_from_courts:
        match:
          name_pattern: " Unit$"
        strip: " Unit$"
        label: "{name} ({stem} County)"

    # A filer knows the town they live in. Whether that town is in the Washington
    # Unit is a different question, and one they should not have to answer, so
    # the unit dropdown above and this lookup are two ways into the same answer.
    - id: place
      type: location
      short_label: "Town or ZIP code"
      when:
        level: [superior]
        division:
          not: [environmental]
      alternative_to: unit
      label: "Or find the unit from a town or ZIP code"
      placeholder: "Town, city, or ZIP code"
      button_label: "Find unit"
      hint: >-
        The town or ZIP code the case is connected to.
      examples: ["Burlington", "Montpelier", "Rutland", "Brattleboro", "05487"]
      matcher: vtcourts
      no_match_hint: >-
        We could not match that town or ZIP code to a unit. Check the spelling,
        or choose the unit from the list above.

# Interview hints remain suggestions. Only unique live-name matches preselect.
handoff:
  filing_intents:
    relief_from_abuse:
      case_category_name_aliases: [Family]
      documents:
        RFAaffidavit:
          filing_type_name_aliases: [Affidavit]
        RFAaffidavitonbehalfofminor:
          filing_type_name_aliases: [Affidavit]
        RFAconfidentialcontactinfo:
          filing_type_name_aliases: [Relief from Abuse Litigant Address Form]
        RFAserviceinfo:
          filing_type_name_aliases: ["Protection Order Service Information DPS #132"]

# Statewide claim-dependent entry fees, reviewed 2026-09-29.
# Estate-value and stipulated-family fees require facts beyond claim amount;
# use Tyler's static fee when available, otherwise leave them unknown.
fee_estimates:
  surcharges:
    reviewed: "2026-10-14"
    waiver_account_types: [WV]
    payment_methods:
      BankAccount:
        fixed: "1.00"
        only_when_amount_due: true
      CC:
        percent: "2.89"
        basis: court_and_platform
        only_when_amount_due: true
    platform:
      amount: "14.00"
      timing: first_filing_per_filer
      # Shown under the fee on the payment page.
      # Source: https://www.vtcourts.gov/about-vermont-judiciary/electronic-access/electronic-filing/faqs
      note: "Tyler Technologies, which runs Vermont's e-filing system, charges this the first time you file in a case."
      # Paid accounts still incur Tyler fees for $0 court-fee cases.
      # A catalog zero alone is not proof of a statutory exemption.
      exemptions:
        # Explicit-only, like government_or_appointed: no production caller
        # supplies this ID yet, and it is never inferred from a $0 catalog fee.
        - id: no_court_fee_case
          requires_waiver_account: true
          note: &waiver_exemption_note "Vermont courts do not charge fees for this type of case. To claim the exemption, choose “Claim the fee exemption for this case” below. You do not need to qualify based on income."
        - id: protection_order
          case_pattern: 'relief from abuse|stalking|sexual assault|abuse prevention|abuse/neglect/exploitation|vulnerable adult'
          requires_waiver_account: true
          note: *waiver_exemption_note
        # Exact catalog labels, verified against the sources below. Do not
        # match generic administrative appeals, probate zeros or conversions.
        # Section 2148 establishes the court-fee exemption. WV handling follows
        # the Judiciary guide’s general instructions for statutorily exempt filers;
        # a fresh authenticated quote for this code remains to be verified.
        - id: voter_checklist
          case_pattern: '^Add Name to Voter Checklist$'
          requires_waiver_account: true
          source_url: https://legislature.vermont.gov/statutes/section/17/043/02148
          note: *waiver_exemption_note
        # The guide explicitly allows WV for this label. This is court guidance,
        # not an inference that the restricted party is exempt under 1182(e).
        - id: permission_to_file
          case_pattern: '^Permission to File Pursuant to 15 VSA Sec 1185$'
          initial_only: true
          requires_waiver_account: true
          source_url: https://www.vtcourts.gov/media/12012
          note: *waiver_exemption_note
        # Only the initiating/unrestricted party is established by this context.
        # Do not infer eligibility for a respondent filing into an existing case.
        - id: abusive_litigation
          case_pattern: '^Restricting Abusive Litigation Pursuant to 15 VSA Sec 1182$'
          initial_only: true
          requires_waiver_account: true
          source_url: https://legislature.vermont.gov/statutes/section/15/021/01182
          note: *waiver_exemption_note
        - id: government_or_appointed
          requires_waiver_account: true
        - id: criminal
          case_pattern: '^criminal\b'
          requires_waiver_account: false
  sources:
    - https://www.vtcourts.gov/about-vermont-judiciary/electronic-access/electronic-filing
    - https://legislature.vermont.gov/statutes/section/32/017/01431
  note: >-
    Vermont small-claims entry fees depend on the claim amount.
    Counterclaims have a separate, lower fee schedule.
  rules:
    - case_pattern: 'small\s*claims?'
      filing_pattern: '^counter\s*claim'
      bands:
        - {up_to: 500, low: 25, high: 25}
        - {up_to: null, low: 35, high: 35}
    - case_pattern: 'small\s*claims?'
      filing_pattern: '^(complaint|initial|small\s*claims?|statement of claim)'
      initial_only: true
      bands:
        - {up_to: 1000, low: 65, high: 65}
        - {up_to: null, low: 90, high: 90}

fee_waiver:
  source_url: "https://www.vermontjudiciary.org/self-help/application-waive-filing-fees-and-service-costs"
  benefits: "Some public benefits qualify you. See the court's rules for details."
  income_bands:
    - max_fpl_percent: 150
      waiver_percent: 100
      description: "Use your income before taxes. [150% FPL](https://www.vtlawhelp.org/150-federal-poverty-level-fpl). You may have fees waived."
  # Repeat-filing and prior-order requirements have not yet been confirmed.
  document_guidance: "Include your waiver form or order. Ask the court if an earlier order covers this filing. If you don't pay, have a waiver order, or upload a fee waiver form, the court will reject your filing."

# Standard notices shown before upload, before a court is selected.
# Source: https://efile-test.suffolklitlab.org/jurisdictions/vermont/codes/courts/sc:addison/disclaimer_requirements
# Retrieved 2026-09-29. Review still uses the selected court’s live requirements.
upload_disclaimers:
  - name: Certification agreement
    text: |-
      I certify that I have reviewed the contents of this filing, and that the filing specifies any nonpublic record or contents, and protects those records from disclosure to the public consistent with the Rules for Public Access to Court Records. If any record or content was separated or redacted and filed as confidential, the actions taken to comply with the rules are stated in the “Comments to Court” field.
  - name: Service agreement
    text: |-
      I certify that I am complying with service requirements in V.R.E.F. 11(g) and V.R.C.P. 5(b). (1) I am serving all persons on whom service is required through File and Serve, or (2) I am serving the persons on whom service is required through File and Serve and submitting a certificate of service that describes service on all other persons required to be served by other means, or (3) I am not required to serve my filing on any person.
