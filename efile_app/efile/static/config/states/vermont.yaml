        RFAaffidavitonbehalfofminor:
          filing_type_name_aliases: [Affidavit]
        RFAconfidentialcontactinfo:
          filing_type_name_aliases: [Relief from Abuse Litigant Address Form]
        RFAserviceinfo:
          filing_type_name_aliases: ["Protection Order Service Information DPS #132"]

# Statewide claim-dependent entry fees, reviewed 2026-09-29.
# Estate-value and stipulated-family fees require facts beyond claim amount;
# use Tyler's static fee when available, otherwise leave them unknown.
fee_estimates:
  surcharges:
    reviewed: "2026-10-14"
    waiver_account_types: [WV]
    payment_methods:
      BankAccount:
        fixed: "1.00"
        only_when_amount_due: true
      CC:
        percent: "2.89"
        basis: court_and_platform
        only_when_amount_due: true
    platform:
      amount: "14.00"
      timing: first_filing_per_filer
      # Paid accounts still incur Tyler fees for $0 court-fee cases.
      # A catalog zero alone is not proof of a statutory exemption.
      exemptions:
        # Explicit-only, like government_or_appointed: no production caller
        # supplies this ID yet, and it is never inferred from a $0 catalog fee.
        - id: no_court_fee_case
          requires_waiver_account: true
          note: &waiver_exemption_note "For this type of case, choose a waiver payment account to claim the exemption. You do not need to qualify based on income."
        - id: protection_order
          case_pattern: 'relief from abuse|stalking|sexual assault|abuse prevention|abuse/neglect/exploitation|vulnerable adult'
          requires_waiver_account: true
          note: *waiver_exemption_note
        # Exact catalog labels, verified against the sources below. Do not
        # match generic administrative appeals, probate zeros or conversions.
        # Section 2148 establishes the court-fee exemption. WV handling follows
        # the Judiciary guide’s general instructions for statutorily exempt filers;
        # a fresh authenticated quote for this code remains to be verified.
        - id: voter_checklist
          case_pattern: '^Add Name to Voter Checklist$'
          requires_waiver_account: true
          source_url: https://legislature.vermont.gov/statutes/section/17/043/02148
          note: *waiver_exemption_note
        # The guide explicitly allows WV for this label. This is court guidance,
        # not an inference that the restricted party is exempt under 1182(e).
        - id: permission_to_file
          case_pattern: '^Permission to File Pursuant to 15 VSA Sec 1185$'
          initial_only: true
          requires_waiver_account: true
          source_url: https://www.vtcourts.gov/media/12012
          note: *waiver_exemption_note
        # Only the initiating/unrestricted party is established by this context.
        # Do not infer eligibility for a respondent filing into an existing case.
        - id: abusive_litigation
          case_pattern: '^Restricting Abusive Litigation Pursuant to 15 VSA Sec 1182$'
          initial_only: true
          requires_waiver_account: true
          source_url: https://legislature.vermont.gov/statutes/section/15/021/01182
          note: *waiver_exemption_note
        - id: government_or_appointed
          requires_waiver_account: true
        - id: criminal
          case_pattern: '^criminal\b'
          requires_waiver_account: false
  sources:
    - https://www.vtcourts.gov/about-vermont-judiciary/electronic-access/electronic-filing
    - https://legislature.vermont.gov/statutes/section/32/017/01431
  note: >-
    Vermont small-claims entry fees depend on the claim amount.
    Counterclaims have a separate, lower fee schedule.
  rules:
    - case_pattern: 'small\s*claims?'
      filing_pattern: '^counter\s*claim'
      bands:
        - {up_to: 500, low: 25, high: 25}
        - {up_to: null, low: 35, high: 35}
    - case_pattern: 'small\s*claims?'
      filing_pattern: '^(complaint|initial|small\s*claims?|statement of claim)'
      initial_only: true
      bands:
        - {up_to: 1000, low: 65, high: 65}
        - {up_to: null, low: 90, high: 90}

fee_waiver:
  source_url: "https://www.vermontjudiciary.org/self-help/application-waive-filing-fees-and-service-costs"
  benefits: "Some public benefits qualify you. See the court's rules for details."
  income_bands:
    - max_fpl_percent: 150
      waiver_percent: 100
      description: "Use your income before taxes. [150% FPL](https://www.vtlawhelp.org/150-federal-poverty-level-fpl). You may have fees waived."
  # Repeat-filing and prior-order requirements have not yet been confirmed.
  document_guidance: "Include your waiver form or order. Ask the court if an earlier order covers this filing. If you don't pay, have a waiver order, or upload a fee waiver form, the court will reject your filing."

# Standard notices shown before upload, before a court is selected.
# Source: https://efile-test.suffolklitlab.org/jurisdictions/vermont/codes/courts/sc:addison/disclaimer_requirements
# Retrieved 2026-09-29. Review still uses the selected court’s live requirements.
upload_disclaimers:
  - name: Certification agreement
    text: |-
      I certify that I have reviewed the contents of this filing, and that the filing specifies any nonpublic record or contents, and protects those records from disclosure to the public consistent with the Rules for Public Access to Court Records. If any record or content was separated or redacted and filed as confidential, the actions taken to comply with the rules are stated in the “Comments to Court” field.
  - name: Service agreement
    text: |-
      I certify that I am complying with service requirements in V.R.E.F. 11(g) and V.R.C.P. 5(b). (1) I am serving all persons on whom service is required through File and Serve, or (2) I am serving the persons on whom service is required through File and Serve and submitting a certificate of service that describes service on all other persons required to be served by other means, or (3) I am not required to serve my filing on any person.
