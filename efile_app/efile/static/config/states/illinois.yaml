# Illinois-specific Case Type Configuration
# This file extends the base configuration with Illinois-specific settings

# Pause suggested-document checklists without deleting saved plans or guidance.
document_checklists_enabled: false

# High level metadata
jurisdiction:
  name: "Illinois eFile"
  code: "illinois"
  display_name: "Illinois"
  brand_name: "LITEfile"
  logo: "img/litefile-logo.svg"
  logo_alt: "LITEfile logo"
  icon: "fas fa-balance-scale"
  svg: "img/IL.svg"
  api_endpoint: "/api/illinois"
  official_court_name: "the Illinois Courts"
  official_tool_statement: "LITEfile is an official, approved electronic filing tool of the Illinois Courts."
  court_logos:
    - name: "Illinois Courts"
      src: "img/court-logo-illinois.svg"
      alt: "Seal of the Supreme Court of Illinois"
  partner_logos:
    - name: "Illinois Legal Aid Online (ILAO)"
      src: "img/logo-ilao.png"
      alt: "Illinois Legal Aid Online logo"
      url: "https://www.illinoislegalaid.org/"
      role: "Project & Funding Partner"
  help_name: "Illinois Court Help"
  help_url: "https://www.ilcourthelp.gov/"
  help_number: "833-411-1121"
  contact_email: "litlab@suffolk.edu"
  contact_address: "Suffolk University Law School LIT Lab, 120 Tremont Street, Boston, MA"

# Keep proxy email notifications disabled until delivery, sender, recipient, and
# partner wording have been verified in the live Illinois environment.
submission_notifications:
  enabled: false

filing_timing:
  timezone: America/Chicago
  business_calendar:
    country: US
    subdivision: IL
    # Pulaski Day is a Cook closure, not statewide court guidance.
    excluded_holidays: [Casimir Pulaski Day]
    review_days: 2
    closed_weekdays: [5, 6]
    holiday_names:
      Columbus Day: "Indigenous Peoples’ Day / Columbus Day"
  review:
    # Plain-language display of the published 24–48 business-hour guidance.
    label: "1–2 days"
    source_url: "https://www.illinoiscourts.gov/News/656/12-Ways-to-Avoid-A-Rejected-EFiling-and-Other-Illinois-EFiling-Tips/news-detail/"
    checked_on: "2026-10-12"

# State metadata, for the address
state:
  code: "IL"
  name: "Illinois"
  jurisdiction: "illinois"

# When the court offers both choices, preselect its public/non-confidential
# document type. A saved filer choice always takes precedence.
document_confidentiality:
  default: "non_confidential"

# Words and sentences this jurisdiction says differently. Keys, defaults, and
# what each one is for are in efile/utils/ui_text.py; anything not listed here
# uses the default English wording. Illinois keeps the default "petition" as the
# example of a document that starts a case.
text:
  organize_documents:
    confidentiality_help: >-
      You may only file a document confidentially when a court rule or court
      order requires it.
  about:
    project_partner_description: >-
      LITEfile's Illinois e-filing integration was developed in close
      partnership with Illinois Legal Aid Online (ILAO), who provided project
      leadership, co-development, and funding to expand accessible electronic
      court filing for self-represented litigants in Illinois.

# Inherit from base case types and customize
inherits_from: "base-case-types.yaml"

# Illinois-specific overrides and extensions
case_types:
  name_change:
    # Inherit from base but add Illinois-specific requirements
    extends: "base_case_types.name_change"

    # Case type names Illinois courts publish for a name change. "Name Change"
    # is Cook County's County Division; every other circuit checked calls it
    # "Change of Name". Names are per state: the base file carries no list to
    # inherit, because another state's courts call this something else.
    matches:
      names:
        - "Name Change"
        - "Change of Name"

    # Shown on the filer's plan, folded away until they ask for it. This is the
    # place to be honest about what the list is and what it cannot know.
    about:
      summary: >-
        A name change asks a judge to make your new name official. Most of the
        work is paperwork: a request that says who you are and what you want to
        be called, notice in a newspaper so the change is public, and an order
        for the judge to sign. Courts differ about the rest, and yours may ask
        for something this list does not mention.
      learn_more_url: "https://www.illinoislegalaid.org/legal-information/changing-your-name"
      learn_more_label: "Changing your name in Illinois (Illinois Legal Aid Online)"

    # 735 ILCS 5/21-101 and following. Requirement levels are guidance for the
    # filer, not court validation.
    documents:
      # filing_type_names says what the court calls each document when it is
      # filed, most preferred first, so a document added from this list arrives
      # already knowing its filing type instead of leaving the filer to pick it
      # out of forty. Courts name the same thing differently and some offer no
      # name for it at all, which is why it is a list and why nothing breaks
      # when none of them match.
      petition:
        label: "Request for name change"
        requirement: always
        role: lead
        description: "Your name now, the name you want, and how long you have lived in Illinois."
        filing_type_names:
          - "Petition for Name Change"    # Cook County, County Division
          - "Petition"                    # Kane, and most circuits
          - "Complaint"
      proposed_order:
        label: "Proposed order for the judge to sign"
        requirement: always
        # No circuit checked publishes an "Order" filing type for a name change,
        # so this usually lands on the court's catch-all -- and on courts with
        # no catch-all either, the filer still chooses it themselves.
        filing_type_names:
          - "Proposed Order"
          - "Order"
          - "Other Document Not Listed"   # Kane
          - "Other Document not listed here"
      notice_of_court_date:
        label: "Notice of your court date"
        requirement: usually
        filing_type_names:
          - "Notice of Motion"            # Cook County, County Division
          - "Notice"                      # Kane
      publication_notice:
        label: "Proof that a newspaper published your notice"
        requirement: usually
        description: "A newspaper must run the notice once a week for three weeks, unless the judge excuses you."
        filing_type_names:
          - "Proof of Service by Publication"      # Cook County, County Division
          - "Affidavit of Service by Publication"
          - "Publications"                         # Kane
      motion_to_waive_publication:
        label: "Motion to skip the newspaper notice"
        requirement: sometimes
        description: "Ask for this if publishing your name would put you in danger."
        # Only a real motion type. "Notice of Motion", which is what Cook offers
        # here, is notice that a motion will be heard rather than the motion, so
        # leaving this blank for the filer to choose beats filing it as the
        # wrong thing.
        filing_type_names:
          - "Motion"                      # Kane
      fee_waiver:
        label: "Request to waive court fees"
        requirement: sometimes
        description: "File this if you cannot afford the filing fee."
        # All fee_waiver items use the statewide fee_waiver hierarchy below.
      minor_consent:
        # Only meaningful when the lead document is the minor-name-change form,
        # so it is tied to the filing type names Illinois courts use for it.
        label: "Written consent from the child"
        requirement: sometimes
        description: "A child who is 14 or older has to agree to the new name."
        when:
          lead_filing_type_names:
            - "Request for Name Change (Minor Children)"
            - "Request for Name Change (Child Information)"
            - "Request for Name Change (Additional Children)"
      notice_to_other_parent:
        label: "Notice for the other parent"
        requirement: sometimes
        when:
          lead_filing_type_names:
            - "Request for Name Change (Minor Children)"
            - "Request for Name Change (Child Information)"
            - "Request for Name Change (Additional Children)"
            - "Request for Name Change (Additional Parent)"

    # Illinois-specific validation rules
    validation_rules:
      - field: "petitioner_first_name"
        rule: "no_special_chars"
        message: "First name cannot contain special characters"
      - field: "new_last_name" 
        rule: "max_length"
        value: 50
        message: "Last name cannot exceed 50 characters"

  divorce:
    extends: "base_case_types.divorce"

    # Cook County's Domestic Relations Division names the case type after the
    # petition; the other circuits use the "Dissolution (with children)" family.
    # Matching ignores case, extra spaces, and the difference between a hyphen
    # and a dash, so one entry covers every spelling of the same name.
    matches:
      names:
        - "Petition for Dissolution of Marriage - Children"
        - "Petition for Dissolution of Marriage - No Children"
        - "Petition for Dissolution (Civil Union) - Children"
        - "Petition for Dissolution (Civil Union) - No Children"
        - "Joint Petition For Simplified Dissolution"
        - "Dissolution (with children)"
        - "Dissolution (without children)"
        - "Dissolution of Civil Union (with children)"
        - "Dissolution of Civil Union (without children)"
        - "Domestic Violence Dissolution (with Children)"
        - "Domestic Violence Dissolution (without Children)"
        - "Domestic Violence Dissolution of Civil Union (with Children)"
        - "Domestic Violence Dissolution of Civil Union (without Children)"

    # 750 ILCS 5/401 and following, plus Illinois Supreme Court Rules 138 and 298.
    documents:
      petition:
        label: "Petition to end your marriage"
        requirement: always
        role: lead
      summons:
        label: "Summons for your spouse"
        requirement: usually
        description: "You do not need this if your spouse files an appearance or signs a waiver."
      financial_affidavit:
        label: "Financial affidavit"
        requirement: usually
        description: "The court needs this to decide support, maintenance, or who pays the fees."
      certificate_of_dissolution:
        label: "Certificate of dissolution of marriage"
        requirement: usually
        description: "The state health department form the judge needs before signing the judgment."
      proof_of_service:
        label: "Proof that your spouse got a copy"
        requirement: usually
      parenting_plan:
        label: "Parenting plan"
        requirement: sometimes
        description: "File this if you have children under 18."
      marital_settlement_agreement:
        label: "Marital settlement agreement"
        requirement: sometimes
        description: "File this if you and your spouse already agree on money and property."
      proposed_judgment:
        label: "Proposed judgment for the judge to sign"
        requirement: sometimes
      fee_waiver:
        label: "Request to waive court fees"
        requirement: sometimes
        description: "File this if you cannot afford the filing fee."

    # Illinois-specific additions
    sections:
      parties:
        fields:
          - section_title: "Children"
            required: false
            conditional_requirements: {}
              # show_when_field: "has_children"
              # show_when_value: true
            fields:
              - name: "has_children"
                label: "Are there minor children of this marriage?"
                type: "radio"
                required: true
                column_width: "col-12"
                options:
                  - value: true
                    label: "Yes"
                  - value: false
                    label: "No"
              - name: "child_count"
                label: "Number of minor children"
                type: "number"
                required: true
                column_width: "col-6"
                min: 1
                max: 10
                conditional_display:
                  # show_when_field: "has_children"
                  # show_when_value: true

  # Eviction is checklist-only: it has no dynamic form sections yet, so it does
  # not extend a base case type.
  eviction:
    description: "Residential eviction cases, from either side"
    matches:
      names:
        # Cook County Municipal Civil Division
        - "Eviction - Possession - Residential Complaint Filed - Non-Jury"
        - "Eviction - Possession - Residential Complaint Filed - Jury"
        - "Eviction - Joint Action - Residential Complaint Filed - Non-Jury"
        - "Eviction - Joint Action - Residential Complaint Filed - Jury"
        - "Eviction - Non-ERP Case - Residential - Possession Only"
        - "Eviction - Non-ERP Case - Residential - Joint Action"
        - "CHA Eviction - Non-Jury"
        - "CHA Eviction - Jury"
        # Circuits outside Cook County
        - "Residential - Eviction"
        - "Residential - Eviction Possession Only"
        - "Eviction - Residential - Eviction"
        - "Eviction - Residential - Eviction Possession Only"

    # 735 ILCS 5/9-101 and following. An eviction is two different filings
    # depending on who is making it, so this case type declares both sides. The
    # filer picks one on the Check documents screen, and gets that side's
    # documents, described in the second person to that side.
    filer_roles:
      landlord:
        label: "The landlord, or someone filing for the landlord"
        description: "You are asking the court to end a tenancy, or for rent the tenant owes."
        # Used to suggest the filer's own party type later. Matched against the
        # party-type names the court publishes, not against Tyler codes.
        party_type_keywords:
          - "plaintiff"
          - "petitioner"
        # A hint only: the side is a legal fact about the filer, so it is
        # offered for confirmation and never decided for them.
        suggested_when:
          lead_filing_type_names:
            - "Complaint"
            - "Eviction Complaint"
            - "Complaint / Petition - Eviction - Residential - Possession Only - Fee"
            - "Complaint / Petition - Eviction - Residential - Possession Only (Govn't) - Fee"
      tenant:
        label: "The tenant"
        description: "You live in the place, and the landlord has started a case against you."
        party_type_keywords:
          - "defendant"
          - "respondent"
        suggested_when:
          lead_filing_type_names:
            - "Appearance"
            - "Appearance Filed"
            - "Appearance (No Fee)"
            - "Appearance Filed - Fee"
            - "Appearance Filed - Eviction - Possession Only"
            - "Answer"
            - "Answer Filed"

    # Each side of an eviction is doing a different thing, so each side gets its
    # own explanation and its own place to read more.
    about:
      summary: >-
        An eviction case decides who has the right to live in a home. It moves
        faster than most court cases, so dates matter more than usual.
      by_role:
        landlord:
          summary: >-
            An eviction case asks the court for possession of a property, and
            sometimes for unpaid rent. It starts with the written notice you
            gave the tenant: the case can be dismissed if that notice was wrong
            or is missing, so it belongs with the complaint. This list covers
            the usual paperwork, not the local rules of your courtroom.
          learn_more_url: "https://www.illinoiscourts.gov/documents-and-forms/approved-forms/"
          learn_more_label: "Illinois Supreme Court approved eviction forms"
        tenant:
          summary: >-
            Your landlord has asked the court to make you leave. Filing an
            appearance is what keeps you in the case, so the judge does not
            decide it without hearing from you, and an answer is where you say
            what you disagree with and why. Eviction moves quickly, and there
            may be defenses or rent help this list cannot tell you about, so it
            is worth talking to a lawyer as early as you can.
          learn_more_url: "https://www.illinoislegalaid.org/legal-information/eviction"
          learn_more_label: "Eviction: your rights as a tenant (Illinois Legal Aid Online)"

    documents:
      # One side's lead document is not on the other side's list at all: a
      # tenant should never be told they might need to file a complaint.
      complaint:
        label: "Eviction complaint"
        requirement: always
        role: lead
        for_roles: ["landlord"]
        description: "This starts the case. It says who lives there and what you are asking the court to do."
      appearance:
        label: "Appearance form"
        requirement: always
        role: lead
        for_roles: ["tenant"]
        description: "This tells the court you are in the case, so the judge does not rule without you."
      answer:
        label: "Answer to the complaint"
        requirement: usually
        for_roles: ["tenant"]
        description: "Your response to what the landlord says, and any defenses you have."

      # Both sides file these, but they are not the same sentence to each of
      # them. by_role changes only the wording and how often it is needed.
      landlord_notice:
        label: "The written notice about ending the tenancy"
        requirement: sometimes
        by_role:
          landlord:
            label: "The notice you gave the tenant"
            requirement: always
            description: "The 5, 10, or 30 day notice you served before filing, and how the tenant got it."
          tenant:
            label: "The written notice your landlord gave you"
            requirement: sometimes
            description: "For example, a 5, 10, or 30 day notice."
      lease:
        label: "The lease"
        requirement: sometimes
        by_role:
          landlord:
            label: "The lease"
            requirement: usually
            description: "Attach it if the tenancy is in writing. It shows what the tenant agreed to."
          tenant:
            label: "Your lease"
            description: "If you have a written lease, the judge will want to see it."
      proof_of_service:
        label: "Proof that the other side got a copy"
        requirement: usually
        by_role:
          landlord:
            label: "Proof that the tenant got the court papers"
            description: "The sheriff or a special process server files this after serving the summons."
          tenant:
            label: "Proof that the landlord got a copy"
            description: "Send the landlord a copy of everything you file, and tell the court you did."
      fee_waiver:
        label: "Request to waive court fees"
        requirement: usually
        by_role:
          landlord:
            requirement: sometimes
            description: "File this if you cannot afford the fee to start the case."
          tenant:
            description: "File this if you cannot afford the fee to file your appearance."
      jury_demand:
        label: "Request for a jury"
        requirement: sometimes
        by_role:
          landlord:
            description: "Ask for this when you file if you want a jury."
          tenant:
            description: "Ask for this by your first court date if you want a jury."

# Broad guidance for a case category, used when no case type matches. A case
# type checklist replaces this list; the two are never merged.
case_categories:
  domestic_relations:
    matches:
      names:
        - "Domestic Relations - General Proceedings"
        - "Domestic Relations - Parentage/Child Support"
        - "Dissolution (Divorce) with Children"
        - "Dissolution (Divorce) without Children"
        - "Family"
    documents:
      financial_information:
        label: "Your financial information"
        requirement: usually
        description: "Pay stubs, tax returns, and a list of what you own and owe."
      proof_of_service:
        label: "Proof that the other side got a copy"
        requirement: usually
      fee_waiver:
        label: "Request to waive court fees"
        requirement: sometimes

  eviction:
    matches:
      names:
        - "Eviction"
        - "Housing"
    documents:
      lease:
        label: "Your lease"
        requirement: usually
      landlord_notice:
        label: "The written notice your landlord gave you"
        requirement: usually
      fee_waiver:
        label: "Request to waive court fees"
        requirement: sometimes

  small_claims:
    matches:
      names:
        - "Small Claims"
    documents:
      supporting_records:
        label: "Papers that back up your side"
        requirement: usually
        description: "For example, a contract, bills, receipts, or letters."
      proof_of_service:
        label: "Proof that the other side got a copy"
        requirement: usually
      fee_waiver:
        label: "Request to waive court fees"
        requirement: sometimes

# What a filer wants to do, in their words, mapped to a checklist above.
#
# Read by the "Find the documents you need" pages, which a filer can reach
# before they have uploaded anything -- or signed in. Each intent points at an
# existing case_types or case_categories entry by its key, so the list shown is
# exactly the one Check documents shows later. Intents never name Tyler codes.
#
# Links must be https and must be pages a partner has reviewed. Kinds:
#   interview     a guided interview that fills in the forms (for example, an
#                 ILAO Easy Form). Filling one in does not file anything.
#   form          an official blank or fillable form
#   instructions  official instructions for completing the forms
#   help          a court or legal-help page about this kind of case
# document_resources attaches links to one checklist item, by its item ID.
# Court PDF addresses change when a form is revised; run
# `manage.py check_document_finder_links` to find links that stopped working.
document_finder:
  links_checked_on: "2026-10-13"
  intents:
    adult_name_change:
      title: "Change my name"
      summary: "Ask a judge to make a new name official for an adult."
      keywords: [name change, new name, legal name, change my last name, change my first name, adult name change]
      filing_path: new
      checklist:
        case_type: name_change
      resources:
        - kind: interview
          label: "Name change for an adult (Easy Form)"
          source: "Illinois Legal Aid Online"
          url: "https://www.illinoislegalaid.org/legal-information/name-change-adult"
        - kind: form
          label: "Name change forms"
          source: "Illinois Courts"
          url: "https://www.illinoiscourts.gov/documents-and-forms/approved-forms/circuit-court-standardized-forms-suites/name-change/"
        - kind: instructions
          label: "How to change your name"
          source: "Illinois Courts"
          url: "https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/b7a5b9eb-93a1-4889-b81d-641afa444a13/NC-A%20Instructions.pdf"
        - kind: help
          label: "Starting a case to change the name of an adult"
          source: "Illinois Legal Aid Online"
          url: "https://www.illinoislegalaid.org/legal-information/changing-your-name"
      document_resources:
        petition:
          - kind: form
            label: "Request for Name Change"
            source: "Illinois Courts"
            url: "https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/74f342af-7d93-4f93-b5b7-fbb92635d45a/NC-A%20Request%20for%20Name%20Change.pdf"
        proposed_order:
          - kind: form
            label: "Order for Name Change"
            source: "Illinois Courts"
            url: "https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/4297bafa-f259-4d32-9a27-585d9bd348f4/NC-A%20Order%20for%20Name%20Change.pdf"
        fee_waiver: &fee_waiver_resources
          - kind: interview
            label: "Fee waiver (Easy Form)"
            source: "Illinois Legal Aid Online"
            url: "https://www.illinoislegalaid.org/legal-information/fee-waiver"
          - kind: form
            label: "Application for Waiver of Court Fees"
            source: "Illinois Courts"
            url: "https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/52beec8c-25fc-4d0f-bc56-82a93b68d395/FW-CIV%20Application.pdf"
          - kind: instructions
            label: "How to request a fee waiver"
            source: "Illinois Courts"
            url: "https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/aeaa0685-7d85-47e4-b113-7492ee0de256/FW-CIV%20Instructions.pdf"

    child_name_change:
      title: "Change my child's name"
      summary: "Ask a judge to change the name of a child under 18."
      keywords: [child name change, minor name change, change my son's name, change my daughter's name, change my kid's last name]
      filing_path: new
      checklist:
        case_type: name_change
      # Shows the items Illinois lists only for the minor-name-change form.
      lead_filing_type_name: "Request for Name Change (Minor Children)"
      resources:
        - kind: interview
          label: "Name change for a child (Easy Form)"
          source: "Illinois Legal Aid Online"
          url: "https://www.illinoislegalaid.org/legal-information/name-change-child"
        - kind: form
          label: "Name change forms"
          source: "Illinois Courts"
          url: "https://www.illinoiscourts.gov/documents-and-forms/approved-forms/circuit-court-standardized-forms-suites/name-change/"
        - kind: instructions
          label: "How to change children's names"
          source: "Illinois Courts"
          url: "https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/16f815a6-c2b3-4a20-bbee-75ed1c325654/NC-M%20Instructions.pdf"
        - kind: help
          label: "Starting a case to change a child's name"
          source: "Illinois Legal Aid Online"
          url: "https://www.illinoislegalaid.org/legal-information/changing-childs-name"
      document_resources:
        petition:
          - kind: form
            label: "Request for Name Change (Minor Children)"
            source: "Illinois Courts"
            url: "https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/76ab40ea-58b3-420b-84de-dd4a1a8662c1/NC-M%20Request%20for%20Name%20Change.pdf"
          - kind: form
            label: "Request for Name Change - Child Information"
            source: "Illinois Courts"
            url: "https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/2e9231f7-fbb8-4b96-af93-692750debf13/NC-M%20Request%20for%20Name%20Change%20Child%20Information.pdf"
        proposed_order:
          - kind: form
            label: "Order for Name Change (Minor Children)"
            source: "Illinois Courts"
            url: "https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/a10cd8ee-4ed6-45c8-92ca-fcb3d81b7b2f/NC-M%20Order%20for%20Name%20Change.pdf"
        notice_of_court_date:
          - kind: form
            label: "Notice of Court Date for Request for Name Change"
            source: "Illinois Courts"
            url: "https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/2a9c1999-5b66-4553-98cc-860a8b33d1ca/NC-M%20Notice%20of%20Court%20Date.pdf"
        notice_to_other_parent:
          - kind: form
            label: "Statement on Trying to Provide Notice"
            source: "Illinois Courts"
            url: "https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/50a55dfb-f981-4b8b-ad00-43fdb01378f6/NC-M%20Statement%20to%20Provide%20Notice.pdf"
        fee_waiver: *fee_waiver_resources

    divorce:
      title: "Get a divorce"
      summary: "Ask the court to end a marriage or civil union, with or without children."
      keywords: [divorce, end my marriage, dissolution of marriage, end my civil union, separate from my spouse, split up]
      filing_path: new
      checklist:
        case_type: divorce
      resources:
        - kind: interview
