# Account-free guidance; never a live quote. Reviewed 2026-09-29.
fee_estimates:
  surcharges:
    reviewed: "2026-09-29"
    waiver_account_types: [WV]
    payment_methods:
      BankAccount:
        fixed: "0.25"
        only_when_amount_due: true
      CC:
        percent: "2.89"
        basis: court_and_platform
        only_when_amount_due: true
  sources:
    - https://efile.illinoiscourts.gov/faq-page/
    - https://www.ilga.gov/documents/legislation/ilcs/documents/070501050K27.1b.htm
    - https://github.com/SuffolkLITLab/LITEFile/issues/237
  note: >-
    Illinois ranges use the non-Cook and Cook statutory fee limits as a guide,
    not minimum and maximum actual charges. County fees may be lower, and local
    charges may increase the total.
  rules:
    - case_pattern: 'small\s*claims?'
      filing_pattern: '^(complaint|petition|initial|small\s*claims?|statement of claim)'
      initial_only: true
      bands:
        - {up_to: 2500, low: 114, high: 270} # Schedule 3
        - {up_to: 10000, low: 266, high: 362} # Schedule 2
    - case_pattern: 'arbitration'
      filing_pattern: '^(complaint|petition|initial)'
      initial_only: true
      bands:
        - {up_to: 15000, low: 266, high: 362} # Schedule 2
        - {up_to: null, low: 321, high: 371} # Schedule 1
    - case_pattern: 'eviction|forcible entry'
      filing_pattern: '^(complaint|petition|initial)'
      initial_only: true
      bands:
        - {up_to: 0, low: 114, high: 270} # Possession only
        - {up_to: null, low: 266, high: 362} # With a money claim
    - case_pattern: 'chancery|dissolution|divorce|family|^law\b'
      filing_pattern: '^(complaint|petition|initial)'
      initial_only: true
      bands:
        - {up_to: null, low: 321, high: 371}

# Eligibility guidance, not an automatic eligibility determination.
fee_waiver:
  # #303: use the specific fee-waiver type before either generic fallback.
  # These names cover both a waiver application and an approved waiver order.
  preferred_filing_type_names:
    - "Application Waiver of Court Fees (Civil)"
  fallback_filing_type_names:
    - "Waiver"
    - "Application"
  source_url: "https://www.illinoislegalaid.org/legal-information/court-fees-and-fee-waivers"
  benefits: "Benefits that may qualify include SSI, SNAP, TANF, and other income-based benefits."
  income_bands:
    - max_fpl_percent: 125
      waiver_percent: 100
      description: "You may have all fees waived."
    - min_fpl_percent_exclusive: 125
      max_fpl_percent: 200
      description: "You may get a partial reduction in fees above 125%. The court also looks at your assets."
  document_guidance: "Include your waiver form or order. An Illinois waiver order usually lasts 12 months. If it is from another court, you may need to show a copy."

# Standard statewide notices shown before court selection.
# Source: https://efile-test.suffolklitlab.org/jurisdictions/illinois/codes/courts/adams/disclaimer_requirements
# Retrieved 2026-09-29; also matched Cook, DuPage, Lake, and Will.
# HTML formatting removed from the source text. Local notices remain on Review.
upload_disclaimers:
  - name: Supreme Court Rule 15
    text: |-
      By submitting this acknowledgement, you represent that the document(s) you are filing comply with the following requirements:
      For all cases, Supreme Court Rule 15 requires you to redact Social Security Numbers (except the last 4 digits) in all documents and attachments or file them in conjunction with a “Notice of Confidential Information Within Court Filing” Form.
  - name: Supreme Court Rule 138
    text: |-
      For civil cases, Supreme Court Rule 138 requires you to redact Personal Identity Information (except the last 4 digits) in all documents and attachments or file them in conjunction with a "Notice of Confidential Information Within Court Filing" Form. Personal Identity Information includes Taxpayer Identification Numbers, Driver’s License Numbers, Financial Account Numbers, Debit/Credit Card Numbers, and any other information as provided by court order or local rule.
