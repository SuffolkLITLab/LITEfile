# Production at https://app.litefile.org

app = 'litefile-prod'
primary_region = 'ord'

# Stop machines gracefully (#445). Fly's default sends SIGINT (Gunicorn's
# "quick shutdown") and kills the machine 5 seconds later. A court submission
# takes 20-30 seconds or more, so an autostop cut one off mid-call and the filer
# was told it failed after the court had it. SIGTERM is Gunicorn's graceful
# signal; it finishes in-flight requests within --graceful-timeout, kept below
# kill_timeout (Fly's maximum) so Gunicorn exits before it is killed. A court
# call can take up to EFILE_SUBMISSION_READ_TIMEOUT_SECONDS; one still running
# at the kill is left SUBMITTING, and Review then reports an unknown outcome.
# Document workers treat SIGTERM like SIGINT (efile.utils.worker_signals).
kill_signal = 'SIGTERM'
kill_timeout = 300

[build]

[env]
  DJANGO_SETTINGS_MODULE = "efile.settings_prod"
  # Long-running workers' progress reaches fly logs as it happens.
  PYTHONUNBUFFERED = "1"
  # One connection per background process; web overrides this to four.
  DB_POOL_MAX_SIZE = "1"
  DB_POOL_MAX_IDLE = "60"
  DOCUMENT_PREPARATION_ASYNC = "true"
  # Copy filing codes straight from the EFSP proxy's codes database, read
  # only. Set the connection with: fly secrets set EFSP_CODES_DATABASE_URL=...
  FILING_CODE_SYNC_MODE = "database"
  # Temporarily uses the test EFSP and its codes database. When switching
  # both EFSP secrets to production, change this schedule to 04:30 Eastern.
  FILING_CODE_SYNC_TIME = "21:30"
  FILING_CODE_SYNC_TIMEZONE = "America/New_York"

[deploy]
  # Replace existing Machines in place; avoid blue/green pool overlap.
  strategy = "rolling"
  # Run database migrations before each release
  release_command = "uv run python manage.py migrate --noinput"
  release_command_timeout = "30m"

[processes]
  app = "env DB_POOL_MAX_SIZE=4 uv run gunicorn efile.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 2 --timeout 60 --graceful-timeout 290 --access-logfile - --error-logfile - --log-level info"
  extraction_worker = "uv run python manage.py process_document_extractions"
  preparation_worker = "uv run python manage.py process_document_preparations"
  # Daily copy + index at FILING_CODE_SYNC_TIME, plus staff-requested resyncs and rebuilds.
  code_index_worker = "uv run python manage.py refresh_filing_code_index --daily --retry-interval 900"

[[restart]]
  # These workers poll the database queue and have no request-driven autostart.
  policy = "always"
  processes = ["extraction_worker", "preparation_worker"]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "30s"
  method = "GET"
  path = "/about/"
  [http_service.checks.headers]
    Host = "app.litefile.org"
    X-Forwarded-Proto = "https"
